body{margin:0;font-family:'Poppins',system-ui,sans-serif;line-height:1.6;color:var(--navy);background:var(--paper)}
.wrap{max-width:640px;margin:0 auto;padding:40px 18px}

a.card b{display:block;font-size:18px}
a.card span{font-size:14px;color:var(--slate)}
